[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.22", "ninja", "nanobind==2.11.0", "drjit==1.3.1"]
build-backend = "scikit_build_core.build"


[project]
name = "rayd-drjit"
version = "0.8.0"
description = "RayD: Dr.Jit-native GPU primitives for differentiable ray geometry and multipath simulation."
readme = "README.md"
authors = [{ name = "Xingyu Chen", email = "xic063@ucsd.edu" }]
license = { text = "BSD-3-Clause" }

requires-python = ">=3.10,<3.15"
dependencies = ["drjit==1.3.1"]

[tool.scikit-build]
build.verbose = true
wheel.expand-macos-universal-tags = true
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel.packages]
"rayd/drjit" = "../python/rayd/drjit"

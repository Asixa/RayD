[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rayd"
version = "0.7.0"
description = "RayD meta-distribution installing the Dr.Jit and Torch backends."
readme = "README.md"
authors = [{ name = "Xingyu Chen", email = "xic063@ucsd.edu" }]
license = "BSD-3-Clause"
requires-python = ">=3.10,<3.15"
dependencies = [
    "rayd-drjit==0.7.0",
    "rayd-torch==0.7.0",
]

[tool.setuptools]
packages = []

[tool.rayd.workspace]
members = ["drjit", "torch"]
distributions = ["rayd", "rayd-drjit", "rayd-torch"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["artifacts", "generated", "**/build", ".worktrees"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = true

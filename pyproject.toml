[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.22", "ninja", "nanobind==2.9.2", "drjit==1.3.1"]
build-backend = "scikit_build_core.build"


[project]
name = "rayd"
version = "0.4.0"
description = "RayD: Dr.Jit-native GPU primitives for differentiable ray geometry and multipath simulation."
readme = "README.md"
authors = [{ name = "Xingyu Chen", email = "xic063@ucsd.edu" }]
license = { text = "BSD-3-Clause" }

requires-python = ">=3.10"
dependencies = ["drjit==1.3.1"]

[tool.scikit-build]
build.verbose = true
wheel.packages = ["rayd"]
wheel.expand-macos-universal-tags = true
build-dir = "build/{wheel_tag}"

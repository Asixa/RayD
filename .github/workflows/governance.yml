# Runs the formatting check and the GPU-free governance and packaging tests on every push and pull request.

name: Governance

on:
  push:
  pull_request:

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance / py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported Pythons; 3.10 also covers the tomli fallback.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # The formatter versions are pinned because their output is the contract; no torch, drjit, or CUDA is installed.
      - run: python -m pip install "tomli>=2; python_version < '3.11'" "ruff==0.14.10" "clang-format==21.1.8"
      - name: Check formatting
        run: python scripts/format_code.py --check
      - name: Run governance and packaging tests
        run: python -m tests.support.hosted_governance

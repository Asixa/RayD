# Single-GPU CUDA and OptiX acceptance.
#
# EXTERNAL RUNNER REQUIRED. Register a runner carrying every label in
# `runs-on` below (`self-hosted`, `linux`, `x64`, `cuda`, `single-gpu`) with
# CUDA Torch, Dr.Jit, the native build dependencies, and OptiX headers.
# Labelled PRs opt in with `run-gpu-ci`; the weekly run detects driver and
# pipeline drift; manual dispatch remains available for release validation.

name: Single-GPU CUDA and OptiX Acceptance

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "41 8 * * 4"
  workflow_dispatch:
    inputs:
      python:
        description: >-
          Interpreter of the prepared CUDA build environment on the runner.
          It must contain CUDA Torch, Dr.Jit, Ninja, CMake, scikit-build-core,
          nanobind, and access to the OptiX headers.
        required: false
        default: python

concurrency:
  group: single-gpu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  single-gpu:
    name: CUDA and OptiX acceptance / 1+ GPU (self-hosted)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'run-gpu-ci')
    runs-on: [self-hosted, linux, x64, cuda, single-gpu]
    timeout-minutes: 180
    env:
      PYTHON: ${{ inputs.python || 'python' }}
      PYTHONPATH: ${{ github.workspace }}/python

    steps:
      - uses: actions/checkout@v5

      - name: Set per-run build and OptiX cache paths
        shell: bash
        # The runner context is not available in job-level env, so the paths under RUNNER_TEMP are exported here.
        run: |
          run_tag="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "OPTIX_CACHE_PATH=$RUNNER_TEMP/rayd-optix-$run_tag" >> "$GITHUB_ENV"
          echo "RAYD_CI_BUILD_ROOT=$RUNNER_TEMP/rayd-build-$run_tag" >> "$GITHUB_ENV"
          echo "RAYD_CI_BUILD_MARKER=$RUNNER_TEMP/rayd-build-$run_tag.marker" >> "$GITHUB_ENV"

      - name: Report the runner's GPUs
        shell: bash
        run: nvidia-smi

      - name: Require a working CUDA device in Torch and Dr.Jit
        shell: bash
        run: |
          "$PYTHON" -I tests/support/single_gpu_ci_preflight.py device

      - name: Build both backends from the checked-out source
        shell: bash
        # The documented source-build route: target exactly the runner's GPUs.
        env:
          RAYD_CUDA_ARCHS: native
        run: |
          mkdir -p "$OPTIX_CACHE_PATH"
          mkdir -p "$RAYD_CI_BUILD_ROOT"
          "$PYTHON" -m pip uninstall -y rayd-drjit rayd-torch
          touch "$RAYD_CI_BUILD_MARKER"
          "$PYTHON" -m pip install --no-deps --no-build-isolation -e drjit \
            -Cbuild-dir="$RAYD_CI_BUILD_ROOT/drjit"
          "$PYTHON" -m pip install --no-deps --no-build-isolation -e torch \
            -Cbuild-dir="$RAYD_CI_BUILD_ROOT/torch"

      - name: Print import paths and require both OptiX backends
        shell: bash
        run: |
          "$PYTHON" -I tests/support/single_gpu_ci_preflight.py optix

      - name: Torch CUDA and OptiX core
        shell: bash
        run: |
          status=0
          for module in \
            tests.parity.test_cuda_geometry \
            tests.parity.test_cuda_multipath \
            tests.native.test_dispatcher_bindings \
            tests.native.test_multipath \
            tests.scene.test_mesh_instancing \
            tests.scene.test_mesh_uv \
            tests.scene.test_scene_validation \
            tests.scene.test_scene_concurrency \
            tests.scene.test_lazy_intersection_staging \
            tests.scene.test_compile_handle_geometry_version \
            tests.scene.test_dynamic_gas_rebuild \
            tests.scene.test_non_finite_vertices \
            tests.edge.test_edge_acceleration_lifecycle \
            tests.edge.test_edge_ray_backends \
            tests.edge.test_short_edge_distance \
            tests.diffraction.test_coherent_multi_state \
            tests.diffraction.test_chain_multi_state \
            tests.reflection.test_torch_high_level_api \
            tests.reflection.test_torch_forward_ad_active_mask
          do
            echo "::group::$module"
            "$PYTHON" -m unittest "$module" -v || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Dr.Jit CUDA and OptiX core
        shell: bash
        run: |
          status=0
          for module in \
            tests.scene.test_geometry_jit \
            tests.scene.test_input_hardening_jit \
            tests.edge.test_native_bvh_query_jit \
            tests.reflection.test_epc_jit \
            tests.reflection.test_accumulation_jit \
            tests.diffraction.test_accumulation_jit \
            tests.visibility.test_visibility_topk_jit
          do
            echo "::group::$module"
            "$PYTHON" -m unittest "$module" -v || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Dr.Jit cold OptiX pipeline matrix
        shell: bash
        run: |
          "$PYTHON" -m unittest tests.native.test_optix_pipeline_cold_create_jit -v

      - name: Runtime diagnostics and OptiX pipeline-create retry
        shell: bash
        # The retry modules compile tests/support/optix_fault_injection.c into a stand-in driver OptiX library and
        # run each case in a child process; they need a C compiler on the runner.
        run: |
          status=0
          for module in \
            tests.runtime.test_diagnostics \
            tests.runtime.test_doctor \
            tests.runtime.test_native_load_failure \
            tests.runtime.test_pipeline_create_retry \
            tests.runtime.test_pipeline_create_retry_jit
          do
            echo "::group::$module"
            "$PYTHON" -m unittest "$module" -v || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Torch CMake configure rules
        shell: bash
        # Real CMake configures of the Torch backend; they need the runner's CUDA torch, nvcc, CMake and Ninja,
        # which the hosted governance job does not have.
        run: |
          "$PYTHON" -m unittest \
            tests.packaging.test_torch_cmake_configure -v

      - name: Mixed geometry and SDF acceptance
        shell: bash
        run: |
          status=0
          for module in \
            tests.mixed.test_mixed_torch \
            tests.mixed.test_mixed_jit \
            tests.sdf.test_intersect \
            tests.sdf.test_operations \
            tests.sdf.test_operations_jit
          do
            echo "::group::$module"
            "$PYTHON" -m unittest "$module" -v || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Cross-backend numerical and AD parity
        shell: bash
        env:
          RAYD_TORCH_RUN_DR_JIT_PARITY: "1"
        run: |
          status=0
          for module in \
            tests.parity.test_drjit \
            tests.parity.test_share2_ad \
            tests.parity.test_backend_parity \
            tests.parity.test_backend_parity_multipath \
            tests.parity.test_validation_parity
          do
            echo "::group::$module"
            "$PYTHON" -m unittest "$module" -v || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Finite-difference gradient checks
        shell: bash
        run: |
          status=0
          for module in \
            tests.gradients.test_geometry_fd_torch \
            tests.gradients.test_geometry_fd_jit \
            tests.gradients.test_multipath_fd_torch \
            tests.gradients.test_multipath_fd_jit
          do
            echo "::group::$module"
            "$PYTHON" -m unittest "$module" -v || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: CI and numerical contract governance
        shell: bash
        run: |
          "$PYTHON" -m unittest \
            tests.governance.test_gpu_ci_contract \
            tests.test_public_api_manifest \
            tests.test_ptx_source_digest \
            tests.test_compile_flag_policy_contract -v

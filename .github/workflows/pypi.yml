name: Build And Publish RayD Distributions

on:
  # GITHUB_ACTIONS_PREBUILD_MATRIX.md: ordinary pushes, pull-request pushes, and
  # tag pushes must not start RayD CI. Validation runs only when a maintainer
  # applies the exact `run-ci` label to a pull request, dispatches the workflow,
  # or publishes a release. To test a later PR revision, remove and reapply the
  # label, or dispatch the workflow at the desired ref.
  pull_request:
    types: [labeled]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scope:
        description: "Build scope"
        type: choice
        default: smoke
        options:
          - smoke
          - full

concurrency:
  group: distributions-${{ github.ref }}-${{ github.event_name }}-${{ inputs.scope || 'default' }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  scope:
    name: Resolve build scope
    runs-on: ubuntu-22.04
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-ci'
    outputs:
      full: ${{ steps.resolve.outputs.full }}
      profile: ${{ steps.resolve.outputs.profile }}
      python-matrix: ${{ steps.resolve.outputs.python-matrix }}
      drjit-cibw-build: ${{ steps.resolve.outputs.drjit-cibw-build }}
      abi-source-python: ${{ steps.resolve.outputs.abi-source-python }}
      abi-matrix: ${{ steps.resolve.outputs.abi-matrix }}
      gencode-families: ${{ steps.resolve.outputs.gencode-families }}
      torch-arch-list: ${{ steps.resolve.outputs.torch-arch-list }}
    steps:
      - name: Resolve architecture and Python coverage
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.scope }}" = "full" ]; then
            full=true
          else
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

          if [ "$full" = "true" ]; then
            echo "profile=release" >> "$GITHUB_OUTPUT"
            # Five grouped families cover sm_70/75/80/86/87/89/90/100/101/120
            # plus compute_120 PTX with five NVCC front ends instead of eleven.
            echo "gencode-families=--generate-code=arch=compute_70,code=[sm_70,sm_75] --generate-code=arch=compute_80,code=[sm_80,sm_86,sm_87,sm_89] --generate-code=arch=compute_90,code=sm_90 --generate-code=arch=compute_100,code=[sm_100,sm_101] --generate-code=arch=compute_120,code=[sm_120,compute_120]" >> "$GITHUB_OUTPUT"
            echo "torch-arch-list=7.0;7.5;8.0;8.6;8.7;8.9;9.0;10.0;10.1;12.0+PTX" >> "$GITHUB_OUTPUT"
            echo 'python-matrix=[{"python-version":"3.10","cibw-build":"cp310-manylinux_x86_64"},{"python-version":"3.11","cibw-build":"cp311-manylinux_x86_64"},{"python-version":"3.12","cibw-build":"cp312-manylinux_x86_64"},{"python-version":"3.13","cibw-build":"cp313-manylinux_x86_64"},{"python-version":"3.14","cibw-build":"cp314-manylinux_x86_64"}]' >> "$GITHUB_OUTPUT"
            echo "drjit-cibw-build=cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64" >> "$GITHUB_OUTPUT"
            echo "abi-source-python=3.10" >> "$GITHUB_OUTPUT"
            echo 'abi-matrix=[{"python-version":"3.10","torch-version":"2.10.0","cuda-index":"cu128"},{"python-version":"3.11","torch-version":"2.10.0","cuda-index":"cu128"},{"python-version":"3.12","torch-version":"2.10.0","cuda-index":"cu128"},{"python-version":"3.13","torch-version":"2.10.0","cuda-index":"cu128"},{"python-version":"3.14","torch-version":"2.10.0","cuda-index":"cu128"},{"python-version":"3.14","torch-version":"2.11.0","cuda-index":"cu128"},{"python-version":"3.14","torch-version":"2.12.0","cuda-index":"cu126"},{"python-version":"3.14","torch-version":"2.13.0","cuda-index":"cu126"}]' >> "$GITHUB_OUTPUT"
          else
            # Reduced compile/package gate. Not a release artifact.
            echo "profile=smoke" >> "$GITHUB_OUTPUT"
            echo "gencode-families=--generate-code=arch=compute_87,code=sm_87 --generate-code=arch=compute_120,code=[sm_120,compute_120]" >> "$GITHUB_OUTPUT"
            echo "torch-arch-list=8.7;12.0+PTX" >> "$GITHUB_OUTPUT"
            echo 'python-matrix=[{"python-version":"3.12","cibw-build":"cp312-manylinux_x86_64"}]' >> "$GITHUB_OUTPUT"
            echo "drjit-cibw-build=cp312-manylinux_x86_64" >> "$GITHUB_OUTPUT"
            echo "abi-source-python=3.12" >> "$GITHUB_OUTPUT"
            echo 'abi-matrix=[{"python-version":"3.12","torch-version":"2.10.0","cuda-index":"cu128"}]' >> "$GITHUB_OUTPUT"
          fi

      - name: Report resolved scope
        shell: bash
        run: |
          echo "full=${{ steps.resolve.outputs.full }}"
          echo "profile=${{ steps.resolve.outputs.profile }}"
          echo "gencode-families=${{ steps.resolve.outputs.gencode-families }}"
          echo "python-matrix=${{ steps.resolve.outputs.python-matrix }}"

  metadata:
    name: Packaging metadata / py${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "tomli>=2; python_version < '3.11'"
      - name: Validate package and release metadata
        shell: bash
        run: |
          python -m unittest tests.packaging.test_project_metadata -v
          (cd backends/drjit && python -m unittest tests.test_project_metadata -v)
          (cd backends/torch && python -m unittest tests.test_project_metadata -v)

  build-drjit-linux:
    name: rayd-drjit / manylinux_2_28 / py${{ matrix.py.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    needs: [scope, metadata]
    strategy:
      fail-fast: false
      matrix:
        py: ${{ fromJSON(needs.scope.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.11.0"
      # One 1 GiB namespace per OS/backend/profile. All Python jobs share it:
      # the C and C++ objects they compile are identical.
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/rayd-sccache
          key: rayd-sccache-v1-linux-drjit-${{ needs.scope.outputs.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            rayd-sccache-v1-linux-drjit-${{ needs.scope.outputs.profile }}-
            rayd-sccache-v1-linux-drjit-
      - name: Expose sccache to manylinux
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/sccache-bin"
          cp "$(command -v sccache)" "$GITHUB_WORKSPACE/.cache/sccache-bin/sccache"
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
      - name: Build and repair Dr.Jit wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: ${{ matrix.py.cibw-build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y dnf-plugins-core gcc-toolset-12 &&
            rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf clean expire-cache &&
            dnf install -y cuda-toolkit-12-8 &&
            ln -sfn /usr/local/cuda-12.8 /usr/local/cuda &&
            /usr/local/cuda/bin/nvcc --version
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_HOME=/usr/local/cuda
            CUDA_PATH=/usr/local/cuda
            CUDA_ROOT=/usr/local/cuda
            CUDA_BIN_PATH=/usr/local/cuda
            CUDACXX=/usr/local/cuda/bin/nvcc
            RAYD_CUDA_GENCODE_FAMILIES="${{ needs.scope.outputs.gencode-families }}"
            PIP_CONSTRAINT=/project/.github/constraints/drjit-build.txt
            CMAKE_BUILD_PARALLEL_LEVEL=4
            CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            CUDAHOSTCXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            CMAKE_C_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            CMAKE_CXX_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            RAYD_NVCC_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            SCCACHE_DIR=/host${{ github.workspace }}/.cache/rayd-sccache
            SCCACHE_CACHE_SIZE=2G
            SCCACHE_BASEDIRS=/project
            SCCACHE_IGNORE_SERVER_IO_ERROR=1
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux_2_28_x86_64
            --exclude libcuda.so.1
            --exclude libnvoptix.so.1
            --exclude libdrjit-core.so
            --exclude libdrjit-extra.so
            --exclude libnanothread.so
            -w {dest_dir} {wheel} &&
            python /project/backends/drjit/scripts/verify_cuda_binary_arches.py
            --profile ${{ needs.scope.outputs.profile }}
            --stem _C {dest_dir}/*.whl &&
            /host${{ github.workspace }}/.cache/sccache-bin/sccache --show-stats &&
            chown -R --reference=/host${{ github.workspace }}
            /host${{ github.workspace }}/.cache/rayd-sccache
        with:
          package-dir: backends/drjit
          output-dir: dist/drjit
      - uses: actions/upload-artifact@v4
        with:
          name: release-rayd-drjit-linux-py${{ matrix.py.python-version }}
          path: dist/drjit/*.whl
          if-no-files-found: error

  build-torch-linux:
    name: rayd-torch / manylinux_2_28 / py${{ matrix.py.python-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    needs: [scope, metadata]
    strategy:
      fail-fast: false
      matrix:
        py: ${{ fromJSON(needs.scope.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out OptiX 8.1 headers
        uses: actions/checkout@v5
        with:
          repository: NVIDIA/optix-dev
          ref: v8.1.0
          path: .optix
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.11.0"
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cache/rayd-sccache
          key: rayd-sccache-v1-linux-torch-${{ needs.scope.outputs.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            rayd-sccache-v1-linux-torch-${{ needs.scope.outputs.profile }}-
            rayd-sccache-v1-linux-torch-
      - name: Expose sccache to manylinux
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/sccache-bin"
          cp "$(command -v sccache)" "$GITHUB_WORKSPACE/.cache/sccache-bin/sccache"
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
      - name: Build and repair Torch wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: ${{ matrix.py.cibw-build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y dnf-plugins-core gcc-toolset-12 &&
            rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf clean expire-cache &&
            dnf install -y cuda-toolkit-12-8 &&
            ln -sfn /usr/local/cuda-12.8 /usr/local/cuda &&
            /usr/local/cuda/bin/nvcc --version
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_HOME=/usr/local/cuda
            CUDA_PATH=/usr/local/cuda
            CUDA_ROOT=/usr/local/cuda
            CUDA_BIN_PATH=/usr/local/cuda
            CUDACXX=/usr/local/cuda/bin/nvcc
            OPTIX_INCLUDE_DIR=/project/.optix/include
            RAYD_TORCH_CUDA_GENCODE_FLAGS="${{ needs.scope.outputs.gencode-families }}"
            TORCH_CUDA_ARCH_LIST="${{ needs.scope.outputs.torch-arch-list }}"
            CMAKE_BUILD_PARALLEL_LEVEL=2
            PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu128
            CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            CUDAHOSTCXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            CMAKE_C_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            CMAKE_CXX_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            CMAKE_CUDA_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            SCCACHE_DIR=/host${{ github.workspace }}/.cache/rayd-sccache
            SCCACHE_CACHE_SIZE=2G
            SCCACHE_BASEDIRS=/project
            SCCACHE_IGNORE_SERVER_IO_ERROR=1
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux_2_28_x86_64
            --exclude libcuda.so.1
            --exclude libnvoptix.so.1
            --exclude libcudart.so.12
            --exclude libc10.so
            --exclude libc10_cuda.so
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libtorch_global_deps.so
            -w {dest_dir} {wheel} &&
            python /project/backends/drjit/scripts/verify_cuda_binary_arches.py
            --profile ${{ needs.scope.outputs.profile }}
            --stem _legacy_ops --stem _stable_ops {dest_dir}/*.whl &&
            python /project/backends/torch/scripts/verify_stable_abi.py
            --source-root /project/backends/torch/src/stable {dest_dir}/*.whl &&
            /host${{ github.workspace }}/.cache/sccache-bin/sccache --show-stats &&
            chown -R --reference=/host${{ github.workspace }}
            /host${{ github.workspace }}/.cache/rayd-sccache
        with:
          package-dir: backends/torch
          output-dir: dist/torch
      - uses: actions/upload-artifact@v4
        with:
          name: release-rayd-torch-linux-py${{ matrix.py.python-version }}
          path: dist/torch/*.whl
          if-no-files-found: error

  build-windows-wheels:
    name: rayd-${{ matrix.backend }} / Windows / py${{ matrix.py.python-version }}
    runs-on: windows-2022
    timeout-minutes: 180
    needs: [scope, metadata]
    strategy:
      fail-fast: false
      matrix:
        backend: [drjit, torch]
        py: ${{ fromJSON(needs.scope.outputs.python-matrix) }}
    env:
      RAYD_CUDA_GENCODE_FAMILIES: ${{ needs.scope.outputs.gencode-families }}
      RAYD_TORCH_CUDA_GENCODE_FLAGS: ${{ needs.scope.outputs.gencode-families }}
      TORCH_CUDA_ARCH_LIST: ${{ needs.scope.outputs.torch-arch-list }}
      OPTIX_INCLUDE_DIR: ${{ github.workspace }}\.optix\include
      # The Visual Studio generator bypasses CMake compiler launchers, so a
      # cache-enabled Windows build must use Ninja.
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      # CUDA is the dominant cost on both backends, so both get a launcher.
      # Torch compiles CUDA through CMake's CUDA language; Dr.Jit uses
      # hand-written nvcc command lines and needs the RAYD_NVCC_LAUNCHER shim.
      CMAKE_CUDA_COMPILER_LAUNCHER: ${{ matrix.backend == 'torch' && 'sccache' || '' }}
      RAYD_NVCC_LAUNCHER: ${{ matrix.backend == 'drjit' && 'sccache' || '' }}
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.backend == 'drjit' && '4' || '2' }}
      SCCACHE_DIR: ${{ github.workspace }}\.cache\rayd-sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Check out OptiX 8.1 headers
        if: matrix.backend == 'torch'
        uses: actions/checkout@v5
        with:
          repository: NVIDIA/optix-dev
          ref: v8.1.0
          path: .optix
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py.python-version }}
      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: "${{ matrix.backend }}-windows-py${{ matrix.py.python-version }}"
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.11.0"
      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\.cache\rayd-sccache
          key: rayd-sccache-v1-windows-${{ matrix.backend }}-${{ needs.scope.outputs.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            rayd-sccache-v1-windows-${{ matrix.backend }}-${{ needs.scope.outputs.profile }}-
            rayd-sccache-v1-windows-${{ matrix.backend }}-
      - name: Export CUDA paths
        shell: pwsh
        run: |
          $cudaRoot = $env:CUDA_PATH
          if (-not $cudaRoot) {
            $nvcc = (Get-Command nvcc -ErrorAction Stop).Source
            $cudaRoot = Split-Path (Split-Path $nvcc -Parent) -Parent
          }
          "CUDA_HOME=$cudaRoot" >> $env:GITHUB_ENV
          "CUDA_PATH=$cudaRoot" >> $env:GITHUB_ENV
      - name: Install Dr.Jit build dependencies
        if: matrix.backend == 'drjit'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build twine "scikit-build-core>=0.10" "cmake>=3.22" ninja
          python -m pip install --constraint .github/constraints/drjit-build.txt "nanobind==2.9.2" "drjit==1.3.1"
      - name: Install Torch build dependencies
        if: matrix.backend == 'torch'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build twine "scikit-build-core>=0.10" "cmake>=3.26" ninja
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
      - name: Build Dr.Jit wheel
        if: matrix.backend == 'drjit'
        working-directory: backends/drjit
        run: python -m build --wheel --no-isolation --outdir ../../dist/drjit
      - name: Build Torch wheel
        if: matrix.backend == 'torch'
        working-directory: backends/torch
        run: >-
          python -m build --wheel --no-isolation --outdir ../../dist/torch
          -Cbuild-dir=artifacts/skbuild
      - name: Verify Dr.Jit wheel
        if: matrix.backend == 'drjit'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/drjit/*.whl).FullName
          python backends/drjit/scripts/verify_cuda_binary_arches.py --profile ${{ needs.scope.outputs.profile }} --stem _C $wheel
          python -m twine check $wheel
      - name: Verify Torch wheel
        if: matrix.backend == 'torch'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/torch/*.whl).FullName
          python backends/drjit/scripts/verify_cuda_binary_arches.py --profile ${{ needs.scope.outputs.profile }} --stem _legacy_ops --stem _stable_ops $wheel
          python backends/torch/scripts/verify_stable_abi.py --source-root backends/torch/src/stable $wheel
          python -m twine check $wheel
      - name: Report compiler cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: release-rayd-${{ matrix.backend }}-windows-py${{ matrix.py.python-version }}
          path: dist/${{ matrix.backend }}/*.whl
          if-no-files-found: error

  test-stable-torch-abi:
    name: Stable ABI / ${{ matrix.os }} / py${{ matrix.compatibility.python-version }} / torch${{ matrix.compatibility.torch-version }}
    needs: [scope, build-torch-linux, build-windows-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        compatibility: ${{ fromJSON(needs.scope.outputs.abi-matrix) }}

    steps:
      - name: Set up compatibility Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.compatibility.python-version }}

      - name: Download Linux Torch wheels
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: release-rayd-torch-linux-py${{ needs.scope.outputs.abi-source-python }}
          path: wheel-artifact

      - name: Download Windows Torch wheel
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: release-rayd-torch-windows-py${{ needs.scope.outputs.abi-source-python }}
          path: wheel-artifact

      - name: Install compatibility Torch
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "torch==${{ matrix.compatibility.torch-version }}" \
            --index-url "https://download.pytorch.org/whl/${{ matrix.compatibility.cuda-index }}"

      - name: Load the same Stable ABI library
        shell: bash
        env:
          EXPECTED_TORCH: ${{ matrix.compatibility.torch-version }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          import torch

          assert torch.__version__.split("+", 1)[0] == os.environ["EXPECTED_TORCH"]
          wheels = sorted(Path("wheel-artifact").glob("*.whl"))
          assert wheels, "RayD Torch wheel artifact is missing"
          with zipfile.ZipFile(wheels[0]) as archive:
              members = [
                  name
                  for name in archive.namelist()
                  if Path(name).name.startswith("_stable_ops")
                  and Path(name).suffix in {".dll", ".so"}
              ]
              assert len(members) == 1, members
              archive.extract(members[0], "stable-library")
          library = Path("stable-library") / members[0]
          torch.ops.load_library(str(library.resolve()))
          assert torch.ops.rayd_torch_stable.camera_sample_to_world is not None
          assert torch.ops.rayd_torch_stable.intersection_valid is not None
          print(f"Loaded {library.name} with torch {torch.__version__}")
          PY

  build-meta:
    name: rayd meta wheel and sdist
    runs-on: ubuntu-22.04
    needs: [scope, metadata]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine "setuptools>=77"
      - run: python -m build --wheel --sdist --no-isolation --outdir dist/meta
      - run: python -m twine check dist/meta/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-rayd-meta
          path: dist/meta/*
          if-no-files-found: error

  validate-wheel-set:
    name: Validate complete release artifact set
    runs-on: ubuntu-22.04
    needs: [scope, build-drjit-linux, build-torch-linux, build-windows-wheels, test-stable-torch-abi, build-meta]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-rayd-*
          merge-multiple: true
      - run: python -m pip install --upgrade pip twine
      # A smoke run deliberately builds one Python version, so the exact release
      # artifact count cannot hold. Layout and metadata checks still apply.
      - name: Validate wheel tags and artifact counts
        if: needs.scope.outputs.full == 'true'
        env:
          RAYD_RELEASE_DIST_DIR: ${{ github.workspace }}/dist
        run: python -m unittest tests.packaging.test_release_artifact_matrix -v
      - name: Validate representative wheel layout
        shell: bash
        run: |
          echo "RAYD_META_WHEEL=$(find dist -maxdepth 1 -name 'rayd-*-none-any.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "RAYD_DRJIT_WHEEL=$(find dist -maxdepth 1 -name 'rayd_drjit-*-cp312-cp312-manylinux_2_28_x86_64.whl' -print -quit)" >> "$GITHUB_ENV"
          echo "RAYD_TORCH_WHEEL=$(find dist -maxdepth 1 -name 'rayd_torch-*-cp312-cp312-manylinux_2_28_x86_64.whl' -print -quit)" >> "$GITHUB_ENV"
      - run: python -m unittest tests.packaging.test_wheel_layout -v
      - run: python -m twine check dist/*

  publish-drjit:
    name: Publish rayd-drjit to PyPI
    # Reduced-architecture artifacts must never reach PyPI. `release: published`
    # already forces the full scope; the scope guard makes that explicit.
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      needs.scope.outputs.full == 'true'
    needs: [scope, validate-wheel-set]
    runs-on: ubuntu-latest
    environment:
      name: pypi-rayd-drjit
      url: https://pypi.org/p/rayd-drjit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-rayd-drjit-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true

  publish-torch:
    name: Publish rayd-torch to PyPI
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      needs.scope.outputs.full == 'true'
    needs: [scope, validate-wheel-set]
    runs-on: ubuntu-latest
    environment:
      name: pypi-rayd-torch
      url: https://pypi.org/p/rayd-torch
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-rayd-torch-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true

  publish-rayd:
    name: Publish rayd meta distribution to PyPI
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      needs.scope.outputs.full == 'true'
    needs: [scope, build-meta, publish-drjit, publish-torch]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rayd
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-rayd-meta
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true

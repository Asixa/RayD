name: Publish Backend Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: [self-hosted, Windows, X64, rayd-gpu]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      RAYD_CUDA_GENCODE_ARCHES: "70,75,80,86,89,90,100,101,120"
      RAYD_CUDA_PTX_ARCH: "120"
    strategy:
      fail-fast: false
      matrix:
        backend: [drjit, torch]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install build scikit-build-core cmake ninja
      - if: matrix.backend == 'drjit'
        run: python -m pip install "nanobind==2.9.2" "drjit==1.3.1"
      - if: matrix.backend == 'torch'
        run: python -m pip install torch
      - if: matrix.backend == 'drjit'
        run: python -m build --wheel --sdist --no-isolation --outdir ../../dist
        working-directory: backends/drjit
      - if: matrix.backend == 'torch'
        run: python -m build --wheel --sdist --no-isolation --outdir ../../dist -Cbuild-dir=artifacts/skbuild
        working-directory: backends/torch
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.backend }}
          path: dist/*

  publish-drjit:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-rayd-drjit
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: release-drjit, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist}

  publish-torch:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-rayd-torch
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: release-torch, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist}

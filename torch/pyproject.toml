[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.26", "ninja", "torch==2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rayd-torch"
version = "0.7.0"
description = "Torch-native RayD geometry and multipath primitives."
readme = "README.md"
authors = [{ name = "Xingyu Chen", email = "xic063@ucsd.edu" }]
license = "BSD-3-Clause"
requires-python = ">=3.10,<3.15"
dependencies = ["torch>=2.10,<2.12"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.wheel.packages]
"rayd/torch" = "../python/rayd/torch"
